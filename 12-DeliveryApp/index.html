<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="build/css/app.css" />
  </head>
  <body>
    <header class="header container">
      <div class="header__logo">
        <img src="build/img/logo.svg" alt="Logo DeliveryApp" />
      </div>
      <nav class="navegation">
        <a href="#" class="navegation__link">Iniciar Sesión</a>
        <a href="#" class="navegation__link">Crear Cuenta</a>
        <a href="#" class="navegation__link navegation__link--register">
          Registrar Restaurant</a
        >
      </nav>
    </header>

    <section class="form container">
      <div class="form__grid">
        <div class="form__content">
          <h2 class="form__title">
            Encuentra y Pide comida de tu restaurante favorito
          </h2>
          <form class="form__search">
            <div class="form__field">
              <label class="form__label" for="restaurant_name"
                >Restaurant</label
              >
              <input
                class="form__input"
                type="text"
                id="restaurant_name"
                placeholder="Tacos México"
              />
            </div>
            <div class="form__field">
              <label class="form__label" for="platillo_name">Platillo</label>
              <input
                class="form__input"
                type="text"
                id="platillo_name"
                name="platillo_name"
                placeholder="Pizza, Ensalada, Hamburguesa"
              />
            </div>
            <input class="form__submit" type="submit" value="Buscar" />
          </form>
        </div>
        <div class="form__image">
          <img
            src="./build/img/dibujo_repartidor.svg"
            alt="Imagen repartidor"
          />
        </div>
      </div>
    </section>

    <section class="step">
      <img class="step__wave" src="./build/img/wave.svg" alt="Imagen de ola" />
      <div class="step_content">
        <h2>
          ¿Cómo funciona?
          <span>tan fácil como 1,2 y 3</span>
        </h2>
        <div class="step__grid container">
          <div>
            <img
              class="step__img"
              src="./build/img/paso_1.png"
              alt="Imagen paso 1"
            />
          </div>
          <div>
            <img
              class="step__img"
              src="./build/img/paso_2.png"
              alt="Imagen paso 1"
            />
          </div>
          <div>
            <img
              class="step__img"
              src="./build/img/paso_3.png"
              alt="Imagen paso 1"
            />
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
